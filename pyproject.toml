[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-audit"
version = "0.1.0"
description = "CLI tool to audit AWS IAM roles and users for over-provisioning"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35.0",
]

[project.scripts]
iam-audit = "iam_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -v"
markers = [
    "integration: integration tests requiring AWS mocks",
    "benchmark: performance benchmark tests",
]

[tool.coverage.run]
source = ["iam_audit"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["iam_audit"]
