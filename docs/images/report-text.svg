<svg xmlns="http://www.w3.org/2000/svg" width="1044" height="830" viewBox="0 0 1044 830" role="img" aria-label="iam-audit text report example">
<style>text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }</style>
<rect width="1044" height="830" rx="10" fill="#0d1117"/>
<rect width="1044" height="34" rx="10" fill="#161b22"/><rect y="24" width="1044" height="10" fill="#161b22"/>
<circle cx="20" cy="17" r="6" fill="#ff5f56"/><circle cx="40" cy="17" r="6" fill="#ffbd2e"/><circle cx="60" cy="17" r="6" fill="#27c93f"/>
<text x="522.0" y="22" text-anchor="middle" fill="#8b949e" style="font-size:13px">iam-audit — terminal</text>
<text x="18" y="66" xml:space="preserve"><tspan fill="#7ee787">$</tspan> <tspan fill="#d4d4d4">iam-audit report</tspan></text>
<text x="18" y="85" xml:space="preserve"><tspan fill="#56d4dd" font-weight="bold">=== IAM Audit Results ===</tspan></text>
<text x="18" y="104" xml:space="preserve"><tspan fill="#d4d4d4">Principals scanned: 11</tspan></text>
<text x="18" y="123" xml:space="preserve"><tspan fill="#d4d4d4">Findings: 22</tspan></text>
<text x="18" y="142" xml:space="preserve"><tspan fill="#d4d4d4"></tspan></text>
<text x="18" y="161" xml:space="preserve"><tspan fill="#56d4dd" font-weight="bold">--- Permission Findings ---</tspan></text>
<text x="18" y="180" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="bold">CRITICAL</tspan><tspan fill="#d4d4d4">  role  ci-admin                                  Overly permissive policy: AdministratorAccess</tspan></text>
<text x="18" y="199" xml:space="preserve"><tspan fill="#8b949e">                Recommendation: Remove this policy or replace with least-privilege permissions. Action &#x27;*&#x27; and Resource</tspan></text>
<text x="18" y="218" xml:space="preserve"><tspan fill="#8b949e">                                &#x27;*&#x27; grants full access. This is an AWS-managed policy and cannot be edited: detach it</tspan></text>
<text x="18" y="237" xml:space="preserve"><tspan fill="#8b949e">                                and attach a customer-managed least-privilege policy instead.</tspan></text>
<text x="18" y="256" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="bold">CRITICAL</tspan><tspan fill="#d4d4d4">  role  mixed-star                                Overly permissive policy: mixed-star-inline</tspan></text>
<text x="18" y="275" xml:space="preserve"><tspan fill="#8b949e">                Recommendation: Remove this policy or replace with least-privilege permissions. Action &#x27;*&#x27; and Resource</tspan></text>
<text x="18" y="294" xml:space="preserve"><tspan fill="#8b949e">                                &#x27;*&#x27; grants full access.</tspan></text>
<text x="18" y="313" xml:space="preserve"><tspan fill="#d4d4d4">  …</tspan></text>
<text x="18" y="332" xml:space="preserve"><tspan fill="#d4d4d4"></tspan></text>
<text x="18" y="351" xml:space="preserve"><tspan fill="#56d4dd" font-weight="bold">--- Unused Permission Findings ---</tspan></text>
<text x="18" y="370" xml:space="preserve"><tspan fill="#ffa657" font-weight="bold">HIGH</tspan><tspan fill="#d4d4d4">      role  mixed-resource                            Unused iam permissions: CreateAccessKey, PassRole</tspan></text>
<text x="18" y="389" xml:space="preserve"><tspan fill="#8b949e">                Recommendation: Remove unused iam permissions from policies.</tspan></text>
<text x="18" y="408" xml:space="preserve"><tspan fill="#ffa657" font-weight="bold">HIGH</tspan><tspan fill="#d4d4d4">      role  power-notaction                           Unused kms permissions</tspan></text>
<text x="18" y="427" xml:space="preserve"><tspan fill="#8b949e">                Recommendation: Remove unused kms permissions from policies.</tspan></text>
<text x="18" y="446" xml:space="preserve"><tspan fill="#d4d4d4">  …</tspan></text>
<text x="18" y="465" xml:space="preserve"><tspan fill="#d4d4d4"></tspan></text>
<text x="18" y="484" xml:space="preserve"><tspan fill="#56d4dd" font-weight="bold">--- Privilege Escalation Findings ---</tspan></text>
<text x="18" y="503" xml:space="preserve"><tspan fill="#ffa657" font-weight="bold">HIGH</tspan><tspan fill="#d4d4d4">      role  mixed-resource                            Privilege escalation path: Create access keys for other users</tspan></text>
<text x="18" y="522" xml:space="preserve"><tspan fill="#8b949e">                Recommendation: Scope iam:CreateAccessKey to the principal&#x27;s own user (${aws:username}).</tspan></text>
<text x="18" y="541" xml:space="preserve"><tspan fill="#ffa657" font-weight="bold">HIGH</tspan><tspan fill="#d4d4d4">      role  passrole-runner                           Privilege escalation path: Pass a role to a new EC2 instance</tspan></text>
<text x="18" y="560" xml:space="preserve"><tspan fill="#8b949e">                Recommendation: Scope iam:PassRole to specific role ARNs and add an iam:PassedToService condition.</tspan></text>
<text x="18" y="579" xml:space="preserve"><tspan fill="#d4d4d4">  …</tspan></text>
<text x="18" y="598" xml:space="preserve"><tspan fill="#d4d4d4"></tspan></text>
<text x="18" y="617" xml:space="preserve"><tspan fill="#56d4dd" font-weight="bold">--- Credential Findings ---</tspan></text>
<text x="18" y="636" xml:space="preserve"><tspan fill="#ffa657" font-weight="bold">HIGH</tspan><tspan fill="#d4d4d4">      user  console-no-mfa                            Console access without MFA</tspan></text>
<text x="18" y="655" xml:space="preserve"><tspan fill="#8b949e">                Recommendation: Require this user to enrol an MFA device, or remove the console password.</tspan></text>
<text x="18" y="674" xml:space="preserve"><tspan fill="#d4d4d4"></tspan></text>
<text x="18" y="693" xml:space="preserve"><tspan fill="#56d4dd" font-weight="bold">--- Trust Policy Findings ---</tspan></text>
<text x="18" y="712" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="bold">CRITICAL</tspan><tspan fill="#d4d4d4">  role  gh-deploy                                 Trust policy: Any GitHub repository can assume this role</tspan></text>
<text x="18" y="731" xml:space="preserve"><tspan fill="#8b949e">                Recommendation: Add a StringEquals/StringLike condition on token.actions.githubusercontent.com:sub</tspan></text>
<text x="18" y="750" xml:space="preserve"><tspan fill="#8b949e">                                limiting it to your repository and branch, e.g. repo:my-org/my-repo:ref:refs/heads/main.</tspan></text>
<text x="18" y="769" xml:space="preserve"><tspan fill="#ff6b6b" font-weight="bold">CRITICAL</tspan><tspan fill="#d4d4d4">  role  trust-anyone                              Trust policy: Any AWS account can assume this role</tspan></text>
<text x="18" y="788" xml:space="preserve"><tspan fill="#8b949e">                Recommendation: Replace &#x27;*&#x27; with specific account or role ARNs, or add a condition such as</tspan></text>
<text x="18" y="807" xml:space="preserve"><tspan fill="#8b949e">                                aws:PrincipalOrgID to restrict callers to your organization.</tspan></text>
</svg>
